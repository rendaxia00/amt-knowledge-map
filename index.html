<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cloud9 AMT 课程中文知识地图与逐章详解">
  <title>AMT 知识地图</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#reader">跳到章节正文</a>
  <div class="terrain" aria-hidden="true">
    <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
      <g class="contours">
        <path d="M-40 210C160 75 300 310 480 180S800 42 1240 190"/><path d="M-20 250C180 115 310 340 500 220S830 90 1240 235"/><path d="M-10 300C220 155 360 400 560 270S900 140 1260 300"/><path d="M-50 660C130 520 310 760 520 610S900 520 1260 680"/><path d="M-20 710C190 570 350 805 570 660S940 590 1260 735"/><path d="M210 -40C100 140 350 220 230 430S120 750 280 950"/><path d="M920 -40C800 160 1060 280 900 500S810 780 970 950"/>
      </g>
    </svg>
  </div>

  <div class="app-shell">
    <aside class="rail" aria-label="主导航">
      <a class="brand" href="#map" aria-label="AMT 知识地图首页">
        <span class="brand-mark">A</span><span><b>AMT</b><small>AUCTION ATLAS</small></span>
      </a>
      <nav class="rail-nav">
        <button class="nav-item active" data-view="map" aria-pressed="true"><span class="nav-icon icon-map" aria-hidden="true"></span><span>知识地图</span></button>
        <button class="nav-item" data-view="chapters" aria-pressed="false"><span class="nav-icon icon-list" aria-hidden="true"></span><span>章节索引</span></button>
        <button class="nav-item" data-view="glossary" aria-pressed="false"><span class="nav-icon icon-term" aria-hidden="true"></span><span>术语表</span></button>
      </nav>
      <div class="source-meta">
        <div><strong id="lessonCount">38</strong><span>课程章节</span></div>
        <div><strong>42h+</strong><span>字幕时长</span></div>
        <div><strong>5</strong><span>学习阶段</span></div>
      </div>
      <p class="rail-note">基于 37 份英文字幕整理<br>第 15 章无英文字幕</p>
    </aside>

    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-expanded="false" aria-controls="rail">菜单</button>
      <label class="search-box" for="searchInput">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索章节、术语或问题" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="top-actions">
        <span class="progress-copy"><b id="completedCount">0</b> / 38 已完成</span>
        <button class="icon-button" id="themeHint" title="阅读提示" aria-label="阅读提示">?</button>
      </div>
    </header>

    <main class="workspace">
      <section class="atlas" id="atlas" aria-labelledby="atlasTitle">
        <div class="atlas-head">
          <div>
            <h1 id="atlasTitle">从市场语境，<br>到可执行优势</h1>
            <p>把 38 章课程放回同一条决策链：先解释市场在哪里，再决定是否、如何出手。</p>
          </div>
          <div class="map-legend" aria-label="地图图例">
            <span><i class="dot subtitle"></i>字幕完整</span>
            <span><i class="dot derived"></i>仅标题提炼</span>
            <span><i class="ring"></i>当前章节</span>
          </div>
        </div>

        <div class="view map-view active" id="mapView">
          <div class="phase-map" id="phaseMap" aria-label="AMT 学习路径图"></div>
        </div>
        <div class="view chapter-view" id="chapterView">
          <div class="chapter-index-head"><h2>全部章节</h2><p>按课程顺序浏览；筛选不会改变原始章节编号。</p></div>
          <div class="chapter-list" id="chapterList"></div>
        </div>
        <div class="view glossary-view" id="glossaryView">
          <div class="chapter-index-head"><h2>核心术语</h2><p>先掌握这些词，再回到地图理解它们的组合关系。</p></div>
          <div class="glossary-list" id="glossaryList"></div>
        </div>
        <div class="empty-state" id="emptyState" hidden>
          <h2>没有匹配结果</h2><p>换一个更短的关键词，例如“接受”“吸收”或“风险”。</p>
        </div>
      </section>

      <article class="reader" id="reader" aria-live="polite">
        <div class="reader-topline">
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="reader-nav">
            <button class="chapter-nav-button" id="prevChapter">上一章</button>
            <button class="chapter-nav-button" id="nextChapter">下一章</button>
          </div>
        </div>
        <div id="readerContent"></div>
      </article>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
